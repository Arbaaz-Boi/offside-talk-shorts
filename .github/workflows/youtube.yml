name: YouTube runner
# Processes every jobs/<id>.json without a results/<id>.json and commits the results.
on:
  push:
    branches: [main]
    paths: ["jobs/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube-runner
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Run YouTube jobs
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 tools/yt.py .
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898313+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet && exit 0
          git commit -m "YouTube runner results"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
